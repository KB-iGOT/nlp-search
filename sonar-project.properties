sonar.projectKey=nlp-search
sonar.projectName=nlp-search
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Source and test directories
# Source is src/ [Dockerfile:19, src/main.py:1]
sonar.sources=src
sonar.tests=tests

sonar.language=py
# Python version from Dockerfile:1
sonar.python.version=3.12

# Coverage report generated by:
#   pytest --cov=src --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml

# IMPORTANT — sonar.exclusions vs sonar.coverage.exclusions:
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/migrations/**,\
  **/alembic/**,\
  tests/**

sonar.coverage.exclusions=\
  src/main.py,\
  src/config.py,\
  src/__init__.py,\
  src/search/__init__.py
